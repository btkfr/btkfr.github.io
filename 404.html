<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Bailey Kinney</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F4F0E8; --navy: #1A2B3D; --navy-soft: #35485D;
    --amber: #D9A441; --amber-deep: #8a6a26; --line: #D8D0BC; --white: #FFFEFB;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--cream); color: var(--navy);
    font-family: 'Inter', -apple-system, sans-serif; line-height: 1.6;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  h1, .serif { font-family: 'Fraunces', Georgia, serif; }
  a { color: inherit; }
  .wrap { max-width: 480px; padding: 0 28px; text-align: center; }
  .code {
    font-family: 'Fraunces', serif; font-size: 96px; font-weight: 600;
    color: var(--navy); line-height: 1; letter-spacing: -2px;
  }
  .stage {
    display: inline-block; margin-top: 10px; font-size: 13px; color: var(--amber-deep);
    border: 1px solid var(--amber); padding: 4px 12px; border-radius: 2px; font-weight: 500;
  }
  h2 { font-size: 24px; font-weight: 600; margin-top: 20px; }
  p { margin-top: 12px; color: var(--navy-soft); font-size: 16px; }
  .actions { margin-top: 32px; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .btn {
    display: inline-block; padding: 10px 20px; font-size: 14px;
    border-radius: 3px; text-decoration: none; font-weight: 500;
  }
  .btn-primary { background: var(--navy); color: var(--cream); }
  .btn-primary:hover { background: var(--navy-soft); }
  .btn-ghost { border: 1px solid var(--navy); color: var(--navy); }
  .btn-ghost:hover { background: var(--white); }
</style>
</head>
<body>

<div class="wrap">
  <div class="code">404</div>
  <div class="stage">Not found</div>
  <h2>This page didn't survive the course.</h2>
  <p>Whatever you were looking for isn't at this address. Might have been moved, renamed, or never existed.</p>
  <div class="actions">
    <a class="btn btn-primary" href="index.html">Back to home</a>
    <a class="btn btn-ghost" href="index.html#projects">View projects</a>
  </div>
</div>

</body>
</html>
